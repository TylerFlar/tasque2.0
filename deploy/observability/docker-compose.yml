# A local OpenTelemetry backend: an OTLP collector with Tempo (traces), Loki (logs) and
# Prometheus (metrics) behind one Grafana at http://localhost:3000 (admin / admin).
#   docker compose -f deploy/observability/docker-compose.yml up -d
# Then set OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 for Tasque.
services:
  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - lgtm-data:/data
    restart: unless-stopped

volumes:
  lgtm-data:
