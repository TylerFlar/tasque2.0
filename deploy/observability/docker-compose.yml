# A local OpenTelemetry backend: an OTLP collector with Tempo (traces), Loki (logs) and
# Prometheus (metrics) behind one Grafana at http://localhost:3000, which opens on
# the Tasque dashboard.
#   docker compose -f deploy/observability/docker-compose.yml up -d
# Then set OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 for Tasque, or set
# TASQUE2_TELEMETRY_STACK to this file and let `tasque2 daemon` do both.
services:
  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/tasque-dashboards/tasque-overview.json
    volumes:
      - lgtm-data:/data
      - ./grafana/tasque.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/tasque.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/tasque-dashboards:ro
    restart: unless-stopped

volumes:
  lgtm-data:
